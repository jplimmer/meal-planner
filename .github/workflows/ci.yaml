name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]

    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          working-directory: backend
          enable-cache: true

      # The pnpm version comes from `packageManager` and Node from
      # `devEngines.runtime`, both in frontend/package.json.
      - uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          # Auto-install ignores package-json-file when choosing a working
          # directory and runs `pnpm install` at the repo root, which has no
          # manifest. Install explicitly below instead.
          install: false

      - name: Install backend dependencies
        run: uv sync --locked --project backend

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # The same recipe a developer runs locally, and the same one the
      # pre-commit hooks call.
      - run: just ${{ matrix.task }}
