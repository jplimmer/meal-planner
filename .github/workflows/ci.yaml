name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: just

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
          enable-cache: true

      # The pnpm version comes from `packageManager` and Node from
      # `devEngines.runtime`, both in frontend/package.json. Also installs
      # frontend dependencies, failing if the lockfile is missing or stale.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: frontend
          cache: true
          require-lockfile: true

      - name: Install backend dependencies
        run: uv sync --locked --project backend

      # The same recipe a developer runs locally, and the same one the
      # pre-commit hooks call.
      - run: just ${{ matrix.task }}
