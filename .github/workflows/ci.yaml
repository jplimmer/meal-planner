name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
          enable-cache: true

      # The pnpm version comes from `packageManager` and Node from
      # `devEngines.runtime`, both in frontend/package.json.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: frontend/package.json
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          # Auto-install ignores package-json-file when choosing a working
          # directory and runs `pnpm install` at the repo root, which has no
          # manifest. Install explicitly below instead.
          install: false

      - name: Install backend dependencies
        run: uv sync --locked --project backend

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # The same recipe a developer runs locally, and the same one the
      # pre-commit hooks call.
      - run: just ${{ matrix.task }}
