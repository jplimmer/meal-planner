repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --project backend pyright
        language: system
        files: ^backend/
        pass_filenames: false

      - id: biome
        name: biome
        entry: pnpm --dir frontend exec biome check --write --no-errors-on-unmatched
        language: system
        files: ^frontend/
        pass_filenames: true
