[project]
name = "meal-planner-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jplimmer", email = "135324645+jplimmer@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
meal-planner-backend = "app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
